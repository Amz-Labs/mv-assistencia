<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Redirecionando para o WhatsApp...</title>

  <!-- não indexar -->
  <meta name="robots" content="noindex, nofollow" />

  <!-- Google Tag Manager -->
  <script>
    window.dataLayer = window.dataLayer || [];

    (function(w,d,s,l,i){
      w[l]=w[l]||[];
      w[l].push({
        'gtm.start': new Date().getTime(),
        event:'gtm.js'
      });
      var f=d.getElementsByTagName(s)[0],
          j=d.createElement(s),
          dl=l!='dataLayer'?'&l='+l:'';
      j.async=true;
      j.src='https://www.googletagmanager.com/gtm.js?id='+i+dl;
      f.parentNode.insertBefore(j,f);
    })(window,document,'script','dataLayer','GTM-P2KMWVZM');
  </script>
  <!-- End Google Tag Manager -->

  <!-- favicon -->
  <link rel="icon" href="../assets/img/brand/favicon.png" type="image/png" />

  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 0; }
    .wrap { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    .card { max-width: 720px; width: 100%; background: #fff; border-radius: 14px; padding: 28px; box-shadow: 0 10px 30px rgba(0,0,0,.08); }
    h1 { margin: 0 0 8px; font-size: 22px; }
    p { margin: 0; color: #444; }
    .small { margin-top: 12px; font-size: 13px; opacity: .8; }
    a { color: #003366; font-weight: 600; }
  </style>
</head>

<body>
  <!-- Google Tag Manager (noscript) -->
  <noscript>
    <iframe
      src="https://www.googletagmanager.com/ns.html?id=GTM-P2KMWVZM"
      height="0"
      width="0"
      style="display:none;visibility:hidden">
    </iframe>
  </noscript>
  <!-- End Google Tag Manager (noscript) -->

  <main class="wrap">
    <section class="card">
      <h1>Redirecionando para o WhatsApp…</h1>
      <p>Se não abrir automaticamente, clique no link abaixo:</p>

      <p class="small">
        <a
          id="manualLink"
          href="#"
          rel="noopener noreferrer"
          data-event="click_whatsapp_manual"
          data-source="manual_redirect_link"
        >
          Abrir WhatsApp agora
        </a>
      </p>
    </section>
  </main>

  <script>
    (function () {
      // ==== CONFIG ====
      const phone = "5511958434011";
      const defaultMsg = "Olá! Preciso de assistência 24h.";
      const endpoint = ""; // opcional: "https://SEU-ENDPOINT.com/track"

      // parâmetro opcional para identificar de onde veio:
      // Ex: /r/whatsapp.html?src=hero
      // Ex: /r/whatsapp.html?src=footer_social
      // Ex: /r/whatsapp.html?src=floating_button
      // Ex: /r/whatsapp.html?src=emergency_button
      // Ex: /r/whatsapp.html?src=404
      const params = new URLSearchParams(window.location.search);
      const src = params.get("src") || "unknown";
      const msg = params.get("msg") || defaultMsg;

      const waUrl = `https://wa.me/${phone}?text=${encodeURIComponent(msg)}&utm_source=site&utm_medium=redirect&utm_campaign=whatsapp&src=${encodeURIComponent(src)}`;

      const manual = document.getElementById("manualLink");
      let redirected = false;

      function redirectToWhatsApp() {
        if (redirected) return;
        redirected = true;
        window.location.replace(waUrl);
      }

      // link manual
      manual.href = waUrl;
      manual.target = "_blank";

      manual.addEventListener("click", function () {
        window.dataLayer = window.dataLayer || [];
        window.dataLayer.push({
          event: "click_whatsapp_manual",
          event_category: "engagement",
          event_label: src,
          whatsapp_source: src,
          page_path: window.location.pathname,
          referrer: document.referrer || null
        });
      });

      // ==== 1) TRACKING via Google Tag Manager / DataLayer ====
      window.dataLayer = window.dataLayer || [];
      window.dataLayer.push({
        event: "click_whatsapp",
        event_category: "engagement",
        event_label: src,
        whatsapp_source: src,
        page_path: window.location.pathname,
        referrer: document.referrer || null,
        event_callback: redirectToWhatsApp,
        event_timeout: 1000
      });

      // ==== 2) ENDPOINT externo opcional ====
      // ideia: registrar clique mesmo se analytics estiver bloqueado
      if (endpoint) {
        try {
          const payload = {
            event: "click_whatsapp",
            src,
            path: document.referrer || null,
            ts: Date.now(),
            ua: navigator.userAgent
          };

          navigator.sendBeacon(endpoint, JSON.stringify(payload));
        } catch (e) {}
      }

      // ==== 3) Redirect fallback ====
      // caso o callback do GTM não execute, redireciona mesmo assim
      setTimeout(redirectToWhatsApp, 1200);
    })();
  </script>
</body>
</html>
